[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se-sdd-loop-workflow"
version = "0.1.0"
description = "LangGraph workflow: requirement → plan → tasks → code → tests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "typing-extensions>=4.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sddl = "src.cli:main"
"sddl:init" = "src.cli:main"
"sddl:start" = "src.cli:main"
# 兼容旧命令名
sdd-loop-workflow = "src.cli:main"
"sdd-loop-workflow:init" = "src.cli:main"
"sdd-loop-workflow:start" = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
