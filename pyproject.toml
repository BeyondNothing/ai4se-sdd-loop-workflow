[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se-sdd-loop-workflow"
version = "0.1.0"
description = "LangGraph workflow: requirement → plan → tasks → code → tests"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "langgraph>=0.2.0",
    "typing-extensions>=4.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
# 仅使用无冒号命令名。含 ":" 的入口在 Windows 上无法生成 .exe，
# pip install 会报 OSError / WinError 2（系统找不到指定的文件）。
# 跨平台用法: sddl init / sddl start，或 sddl-init / sddl-start
sddl = "src.cli:main"
sddl-init = "src.cli:main"
sddl-start = "src.cli:main"
sdd-loop-workflow = "src.cli:main"
sdd-loop-workflow-init = "src.cli:main"
sdd-loop-workflow-start = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
