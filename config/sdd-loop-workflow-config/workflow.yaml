# =============================================================================
# SDD Loop Workflow — 业务项目运行时配置
# =============================================================================
# 位置：业务项目根 / sdd-loop-workflow-config / workflow.yaml
# （由 sdd-loop-workflow:init 生成；按本仓库修改即可。）
#
# 业务项目根默认 = 本文件所在目录的上一级。
# 使用 sdd-loop-workflow:start 时，还会用启动时的 cwd（写入环境变量），
# 二者一致时无需再配 app_root。
#
# 节点 tool / prompt / mode 仍在引擎仓库 config/workflow.yaml，不要写在这里。
# =============================================================================

# 文档产出根目录（相对业务项目根）
# 需求产出：<业务根>/<docs_dir>/<需求名>/
# PRD 默认：<业务根>/<docs_dir>/requirements/
# 默认 spec；可改成 docs 等任意相对路径
docs_dir: spec

# 浏览器 E2E（verify_tests）
e2e:
  # false：跳过浏览器 E2E（单元/API 测试仍执行；报告中 TC-E2E-* 标 skip）
  enabled: true
  # false：有界面（默认弹出 Chrome）；true：无界面 headless
  headless: false
  # E2E 服务基址（host/端口）
  base_url: http://localhost:8080
